services:
  - type: web
    name: aether-network-twin
    runtime: python
    plan: free
    buildCommand: python -m unittest discover -s tests -v
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FREE_TIER_CONFIRMED
        value: "false"
